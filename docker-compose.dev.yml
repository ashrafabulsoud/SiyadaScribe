version: "3"
services:
    app:
        image: localhost/siyadascribe-dev:latest
        container_name: siyadascribe-dev
        network_mode: host
        environment:
            DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
            NODE_ENV: development
            TZ: Australia/Melbourne
            SERVER_HOST: 0.0.0.0 # Bind to all interfaces
            RATE_LIMIT_ENABLED: false
            SIYADASCRIBE_ALLOW_UNAUTHENTICATED: true # Dev only: skip startup auth guard
        volumes:
            - .:/usr/src/app
            - /usr/src/app/node_modules
            - /usr/src/app/server/.venv
            - ./data:/usr/src/app/data # Optional: Persist test data
            - ./logs:/usr/src/app/logs # Optional: Persist logs
